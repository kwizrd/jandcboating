en: &DEFAULT_EN
  header:
    title: Professional Boat Care & Delivery
    text: Peace of mind on the water and when you’re away
    button: Our Services
    buttonlink: "#services"

  services:
    title: "Services"
    text: "Trusted care, training, and yacht movement for boat owners who want it done right."
    section: services
    list:
      - title: "Boat Checking & Maintenance"
        desc: "Regular inspections, systems checks, and upkeep while you’re away so your vessel stays ready and protected."
        icon: fas fa-clipboard-check
      - title: "Docking Lessons"
        desc: "Hands-on coaching to build confidence docking in real conditions tight slips, current, wind, and more."
        icon: fas fa-anchor
      - title: "Mechanical Walkthroughs"
        desc: "Detailed system reviews and owner education so you understand your boat’s systems and maintenance needs."
        icon: fas fa-cogs
      - title: "Boat Moving & Relocations"
        desc: "Safe, professional movement of your vessel between docks, marinas, or storage locations."
        icon: fas fa-ship
      - title: "Yacht & Boat Deliveries"
        desc: "Experienced long-distance deliveries by water. We treat your boat like our own from departure to arrival."
        icon: fas fa-route
      - title: "Storm Prep & Haul-Out Support"
        desc: "Thorough preparation before storms and assistance with haul-outs so your boat is secured when it matters most."
        icon: fas fa-cloud-showers-heavy
      - title: "Shakedown Cruises"
        desc: "Post-refit or seasonal shakedown runs to test systems, identify issues, and get everything dialed in before you take over."
        icon: fas fa-water

  portfolio:
    title: "Deliveries & Projects"
    text: "A selection of recent yacht movements and projects."
    section: portfolio
    closebutton: "Close Project"

  timeline:
    title: "Our Approach"
    text: "How we work with owners"
    section: timeline
    events:
      - title: "Understand Your Boat"
        year: "Step 1"
        desc: "We start with a clear conversation about your vessel, systems, goals, and any known issues so nothing is left to chance."
        image: assets/img/timeline/1.jpg
        alt: Understanding the vessel
      - title: "Plan & Prepare"
        year: "Step 2"
        desc: "Detailed planning for deliveries, maintenance schedules, or training sessions — including weather windows, routing, and logistics."
        image: assets/img/timeline/2.jpg
        alt: Planning
      - title: "Execute with Care"
        year: "Step 3"
        desc: "Whether it’s a dockside check, docking lesson, or multi-day delivery, we work methodically and communicate clearly throughout."
        image: assets/img/timeline/3.jpg
        alt: Execution
      - title: "Hand Back Confidently"
        year: "Step 4"
        desc: "You receive a clear summary of work completed, any findings, and recommendations so you can step back aboard with confidence."
        image: assets/img/timeline/4.jpg
        alt: Handover
    end: "Ready when<br>you are"

  about:
    title: "About Us"
    text: "Experienced hands you can trust"
    body: "Jordy and Carol provide professional boat care, owner training, and yacht delivery services. We specialize in looking after vessels while owners are away, teaching practical docking skills, performing thorough mechanical walkthroughs, and safely moving and delivering boats of all sizes. Our focus is straightforward: keep your boat in good shape, help you become more confident, and move it carefully when you need it elsewhere."
    section: about

  clients:
    section: clients
    max-height: 100px
    horizontal-scrolling: ""
    list: []

  team:
    title: "Meet the Team"
    text: "Two experienced professionals dedicated to your boat."
    subtext: "Jordy and Carol handle every project personally — from routine checks to long-distance deliveries."
    section: team
    people:
      - name: "Jordy"
        role: "Captain & Delivery Skipper"
        image: assets/img/team/jordy.jpg
        social: []
      - name: "Carol"
        role: "Operations & Boat Care"
        image: assets/img/team/carol.jpg
        social: []

  contact:
    title: "Get in Touch"
    text: "Tell us about your boat and how we can help."
    section: contact
    name: "Name*"
    name-validation: "Please enter your name."
    email: "Email*"
    email-validation: "Please enter your email address."
    phone: "Phone Number"
    phone-validation: "Please enter your phone number."
    message: "Message*"
    message-validation: "Please enter a message."
